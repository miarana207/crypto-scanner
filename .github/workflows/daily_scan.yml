Scan quotidien on: schedule: - cron: "0 7 * * 1-5" workflow_dispatch: {} jobs: scan: runs-on: ubuntu-latest steps: - name: Récupérer le code uses: actions/checkout@v4 - name: Installer Python uses: actions/setup-python@v5 with: python-version: "3.11" - name: Installer les dépendances run: pip install -r app/requirements.txt - name: Lancer le scan et envoyer les notifications env: SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} SMTP_HOST: smtp.gmail.com SMTP_PORT: 465 EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }} EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }} EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }} run: | cd app python run_and_notify.py --symbols BTCUSDT ETHUSDT SOLUSDT BNBUSDT XRPUSDT ADAUSDT DOGEUSDT AVAXUSDT LINKUSDT DOTUSDT --interval 5m --threshold 60
