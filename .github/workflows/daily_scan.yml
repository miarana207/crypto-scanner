name: Scan quotidien

on:
  schedule:
    # 07:00 UTC = 09:00 heure de Paris (été) / 08:00 (hiver)
    # Ajuste l'heure selon ton fuseau et tes horaires de trading.
    # Format cron: minute heure jour mois jour-semaine (1-5 = lundi-vendredi)
    - cron: "0 * * * *"
  workflow_dispatch: {}  # permet aussi de le lancer manuellement depuis l'onglet Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r app/requirements.txt

      - name: Lancer le scan et envoyer les notifications
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          cd app
          python run_and_notify.py --threshold 60
