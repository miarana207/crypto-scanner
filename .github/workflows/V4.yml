name: V4 Crypto Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V4
        uses: actions/checkout@v4
        with:
          ref: V4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Validate API secrets
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "::error::Le secret FINNHUB_API_KEY est absent ou vide."
            echo "Ajoutez-le dans Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

          if [ -z "$TWELVE_DATA_API_KEY" ]; then
            echo "::error::Le secret TWELVE_DATA_API_KEY est absent ou vide."
            echo "Ajoutez-le dans Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

          echo "Finnhub API key: OK"
          echo "Twelve Data API key: OK"

      - name: Run V4
        env:
          BINANCE_DATA_URL: https://data-api.binance.vision

          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

        run: |
          python app/run_and_notify.py --threshold 75 --limit 1000 --top 5
