name: V4 Crypto Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V4
        uses: actions/checkout@v4
        with:
          ref: V4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Validate required secrets
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          missing=0
          for name in TWELVE_DATA_API_KEY EMAIL_SENDER EMAIL_PASSWORD EMAIL_RECIPIENT SMTP_HOST SMTP_PORT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name est absent ou vide."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Configuration requise : OK"

      - name: Run V4
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"

          # Binance : source de vérité de l'univers SPOT/TRADING.
          BINANCE_DATA_URL: https://data-api.binance.vision

          # Ces valeurs sont volontairement neutres : elles ne retirent
          # aucun marché de l'univers Binance. Elles servent uniquement
          # d'audit et peuvent être durcies plus tard après observation.
          BINANCE_MIN_QUOTE_VOLUME: "0"
          BINANCE_MIN_TRADES: "0"
          BINANCE_MAX_SPREAD_PCT: "999"
          BINANCE_MAX_24H_RANGE_PCT: "999"
          BINANCE_MIN_AGE_DAYS: "0"
          BINANCE_MIN_DEPTH_NOTIONAL: "0"
          BINANCE_MAX_UNIVERSE: "0"
          BINANCE_DEPTH_LIMIT: "100"
          BINANCE_DEPTH_WORKERS: "12"

          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

        run: |
          python -u app/run_and_notify.py --threshold 75 --limit 1000 --top 5
